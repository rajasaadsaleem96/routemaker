name: Build Panorra LKH Windows 10/11

on:
  push:
    branches:
      - build/panorra-lkh-windows10
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Download LKH-3 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\LKH | Out-Null
          git clone --depth 1 https://github.com/cerebis/LKH3.git build\LKH\LKH3

      - name: Apply Panorra matrix-backed directed distance
        shell: pwsh
        run: |
          Copy-Item "LKH-Matrix-Distance.c" "build\LKH\LKH3\SRC\Distance_SPECIAL.c" -Force
          Copy-Item "Panorra-GetTime.c" "build\LKH\LKH3\SRC\GetTime.c" -Force
          $p = "build\LKH\LKH3\SRC\ReadProblem.c"
          $s = Get-Content $p -Raw
          $s = $s.Replace('WeightType != EXPLICIT && WeightType != -1)', 'WeightType != EXPLICIT && WeightType != SPECIAL && WeightType != -1)')
          $s = $s.Replace('&& Distance != Distance_MTSP && Distance != Distance_SPECIAL) {', '&& Distance != Distance_MTSP && Distance != Distance_SPECIAL && Distance != Distance_Asymmetric) {')
          $s = $s.Replace('if (n > MaxMatrixDimension) {', 'if (n > MaxMatrixDimension || WeightType == SPECIAL) {')
          $s = $s.Replace('if (n > MaxMatrixDimension || WeightType == SPECIAL) {', 'if (n > MaxMatrixDimension || WeightType == SPECIAL) {' + [Environment]::NewLine + '        if (WeightType == SPECIAL && M <= 65535) M = INT_MAX / 2 / Precision;')
          Set-Content $p $s -Encoding utf8

      - name: Build LKH engine
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/build/LKH/LKH3/SRC"
          make clean || true
          make CC=gcc
          mkdir -p "$GITHUB_WORKSPACE/Assets"
          cp ../LKH.exe "$GITHUB_WORKSPACE/Assets/LKH.exe"

      - name: Stress-test LKH with 20 route nodes and 1,824-node directed matrix
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "panorra-lkh-smoke"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null

          # Simulate the user's actual shape: about 1,824 mapped matrix points,
          # but a 20-node delivery route whose matrix IDs are spread throughout it.
          $matrixCount = 1824
          $matrixIds = @(1, 1804, 1805, 1806, 1807, 1808, 1809, 1810, 1811, 1812,
                         1813, 1814, 1815, 1816, 1817, 1818, 1819, 1820, 1821, 1822)
          $matrixBytes = New-Object byte[] ([long]$matrixCount * $matrixCount * 2)
          [Random]::new(12345).NextBytes($matrixBytes)

          # Zero diagonal values, as expected for self-to-self distances.
          for ($i = 0; $i -lt $matrixCount; $i++) {
            $offset = (($i * $matrixCount) + $i) * 2
            $matrixBytes[$offset] = 0
            $matrixBytes[$offset + 1] = 0
          }

          $matrix = Join-Path $testDir "distance-matrix.uint16"
          [IO.File]::WriteAllBytes($matrix, $matrixBytes)

          $problem = Join-Path $testDir "smoke.tsp"
          $nodeLines = for ($i = 0; $i -lt $matrixIds.Count; $i++) {
            "{0} {1} 0" -f ($i + 1), $matrixIds[$i]
          }
          $problemLines = @(
            "NAME : PANORRA_STRESS"
            "TYPE : ATSP"
            "DIMENSION : $($matrixIds.Count)"
            "EDGE_WEIGHT_TYPE : SPECIAL"
            "NODE_COORD_TYPE : TWOD_COORDS"
            "NODE_COORD_SECTION"
          ) + $nodeLines + @("EOF")
          $problemLines | Set-Content $problem -Encoding ascii

          $tour = Join-Path $testDir "smoke.tour"
          $par = Join-Path $testDir "smoke.par"
          @"
          PROBLEM_FILE = $problem
          OUTPUT_TOUR_FILE = $tour
          RUNS = 10
          MOVE_TYPE = 5
          MAX_CANDIDATES = 5
          CANDIDATE_SET_TYPE = ALPHA
          INITIAL_TOUR_ALGORITHM = NEAREST-NEIGHBOR
          TRACE_LEVEL = 1
          "@ | Set-Content $par -Encoding ascii

          $engine = Join-Path $env:GITHUB_WORKSPACE "build\LKH\LKH3\LKH.exe"
          $env:PANORRA_MATRIX_FILE = $matrix
          $env:PANORRA_MATRIX_COUNT = "$matrixCount"
          & $engine $par
          if ($LASTEXITCODE -ne 0) {
            throw "LKH 20-node matrix stress test exited with code $LASTEXITCODE"
          }
          if (-not (Test-Path $tour)) {
            throw "LKH did not produce a 20-node stress-test tour."
          }
          $tourText = Get-Content $tour -Raw
          if ($tourText -notmatch "TOUR_SECTION") {
            throw "LKH stress-test output does not contain TOUR_SECTION."
          }
          $tourIds = [regex]::Matches($tourText, "(?m)^\s*\d+\s*$") |
            ForEach-Object { [int]$_.Value.Trim() } |
            Where-Object { $_ -gt 0 }
          if ($tourIds.Count -lt $matrixIds.Count) {
            throw "LKH stress-test tour contains only $($tourIds.Count) nodes."
          }

      - name: Publish single-file Windows app
        shell: pwsh
        run: |
          dotnet publish PanorraLKH.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "bin\Release\net8.0-windows\win-x64\publish\Panorra-LKH-Route-Optimizer.exe" "dist\Panorra-LKH-Route-Optimizer.exe" -Force

      - name: Upload single executable
        uses: actions/upload-artifact@v4
        with:
          name: Panorra-LKH-Windows-10-11
          path: dist/Panorra-LKH-Route-Optimizer.exe
          if-no-files-found: error
